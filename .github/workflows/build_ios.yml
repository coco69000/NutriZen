name: Build NutriZen iOS (Unsigned for Sideloadly)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      COCOAPODS_DISABLE_STATS: 'true'
      SWIFT_PACKAGE_MANAGER_DISABLE: '1'
      FLUTTER_DISABLE_SPM: '1'
      FLUTTER_XCODE_SPM_DISABLED: '1'

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🛠️ Activer Xcode 16
        run: |
          # Sélectionne automatiquement Xcode 16.x installé
          DEVELOPER_DIR=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)/Contents/Developer
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "❌ Xcode 16 non trouvé, utilisation de la version par défaut"
          else
            echo "✅ Utilisation de : $DEVELOPER_DIR"
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          xcodebuild -version
          # Vérifier que le SDK iOS est bien présent
          xcrun --show-sdk-path --sdk iphoneos

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Pré-créer les dossiers de build (Fix rsync SourcePackages)
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ipa/Payload

      - name: 📦 Récupérer les dépendances Flutter
        run: flutter pub get

      - name: ⚙️ Préparer la configuration iOS Flutter
        run: |
          # Cette étape génère les fichiers de base, mais peut réactiver SPM pour Firebase
          flutter build ios --release --no-codesign --config-only

      - name: 🧹 Nettoyer et installer CocoaPods
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod repo update
          pod install --repo-update
          cd ..

      - name: 🚫 Désactiver FORCEMENT Swift Package Manager dans Xcode
        run: |
          cd ios
          # 1. Supprimer le dossier SourcePackages s'il existe (pour éviter les conflits)
          rm -rf ../build/ios/SourcePackages
          
          # 2. Modifier le fichier project.pbxproj pour désactiver SPM
          # Cela empêche Xcode de tenter de résoudre les packages Swift au démarrage
          sed -i '' 's/SWIFT_PACKAGE_MANAGER_ENABLED = YES;/SWIFT_PACKAGE_MANAGER_ENABLED = NO;/g' Runner.xcodeproj/project.pbxproj
          
          # 3. S'assurer que le fichier Package.resolved n'existe pas
          rm -f Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          rm -rf Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          
          cd ..

      - name: 🛠️ Recréer les dossiers de build nécessaires
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ipa/Payload

      - name: 🔨 Compiler l'application iOS (Sans signature)
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_PACKAGE_MANAGER_ENABLED=NO \
            CLONE_SOURCE_PACKAGES=NO
          cd ..

      - name: 📦 Créer le fichier .IPA pour Sideloadly
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app introuvable !"
            find build/ios -name "*.app" -type d
            exit 1
          fi
          
          echo "✅ App trouvée : $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r NutriZen_unsigned.ipa Payload/
          cd ../..

      - name: 🚀 Télécharger le fichier IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NutriZen-iOS-IPA
          path: build/ipa/NutriZen_unsigned.ipa
          retention-days: 7
