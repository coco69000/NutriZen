name: Build NutriZen iOS (Unsigned for Sideloadly)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🛠️ Activer Xcode 16
        run: |
          # Sélectionne Xcode 16 installé sur le runner
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Pré-créer les dossiers de build
        run: |
          mkdir -p build/ios/SourcePackages

      - name: ⚙️ Désactiver Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 📦 Récupérer les dépendances Flutter
        run: flutter pub get

      - name: 🔨 Compiler l'application iOS (Sans signature)
        run: flutter build ios --release --no-codesign

      - name: 📦 Créer le fichier .IPA pour Sideloadly
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r NutriZen_unsigned.ipa Payload/
          cd ../../..

      - name: 🚀 Télécharger le fichier IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NutriZen-iOS-IPA
          path: build/ios/iphoneos/NutriZen_unsigned.ipa
          retention-days: 7
